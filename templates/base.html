<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}نظام السكن الطلابي{% endblock %}</title>
    <!-- CSRF Token للحماية من هجمات Cross-Site Request Forgery -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
    
    <link rel="icon" href="{{ url_for('static', filename='Images/logo.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3.0"> <!--change the v -->
    <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome/css/all.min.css') }}">    

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#1e293b">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="سكن بازرعة">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='Images/logo.png') }}">
    <link rel="apple-touch-startup-image" href="{{ url_for('static', filename='Images/logo.png') }}">

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>

    {% block extra_css %}{% endblock %}
    <script>
        // Apply dark mode immediately before render to prevent flash
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-slate-100 dark:bg-darkBg text-slate-800 dark:text-slate-200 min-h-screen flex relative overflow-x-hidden">

    <!-- خلفية تعتيم عند فتح القائمة على الجوال -->
    <div id="sidebar-overlay" onclick="toggleMobileSidebar(false)" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 hidden md:hidden transition-opacity"></div>

    {% include 'components/sidebar.html' %}

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative min-w-0">
        
        {% include 'components/header.html' %}

        <div class="p-4 sm:p-6 md:p-8 overflow-y-auto flex-1 animate-fade-in">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}?v=3.0"></script>
    {% block scripts %}{% endblock %}
    
    <!-- SweetAlert2 للإشعارات الاحترافية -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const Toast = Swal.mixin({
                toast: true,
                position: 'top-start',
                showConfirmButton: false,
                timer: 3500,
                timerProgressBar: true,
                didOpen: (toast) => {
                    toast.addEventListener('mouseenter', Swal.stopTimer)
                    toast.addEventListener('mouseleave', Swal.resumeTimer)
                }
            });

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        {% set icon = 'success' if category == 'success' else 'error' if category == 'error' else 'info' %}
                        Toast.fire({
                            icon: '{{ icon }}',
                            title: '{{ message }}'
                        });
                    {% endfor %}
                {% endif %}
            {% endwith %}
        });
    </script>

    <!-- CSRF: حقن تلقائي في جميع الفورمات + طلبات AJAX -->
    <script>
        (function() {
            const csrfToken = document.querySelector('meta[name="csrf-token"]');
            if (!csrfToken) return;
            const token = csrfToken.getAttribute('content');

            // 1. حقن توكن CSRF في كل فورم POST تلقائياً عند الإرسال
            document.addEventListener('submit', function(e) {
                const form = e.target;
                if (form.method && form.method.toLowerCase() === 'post') {
                    if (!form.querySelector('input[name="csrf_token"]')) {
                        const input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = 'csrf_token';
                        input.value = token;
                        form.appendChild(input);
                    }
                }
            }, true);

            // 2. حقن header CSRF في كل طلبات fetch تلقائياً
            const origFetch = window.fetch;
            window.fetch = function(url, options) {
                options = options || {};
                const method = (options.method || 'GET').toUpperCase();
                if (method !== 'GET' && method !== 'HEAD') {
                    options.headers = options.headers || {};
                    // تجنب تعارض headers إن كانت Headers object
                    if (options.headers instanceof Headers) {
                        if (!options.headers.has('X-CSRFToken')) {
                            options.headers.set('X-CSRFToken', token);
                        }
                    } else {
                        options.headers['X-CSRFToken'] = options.headers['X-CSRFToken'] || token;
                    }
                }
                return origFetch.call(this, url, options);
            };
        })();
    </script>
</body>
</html>
