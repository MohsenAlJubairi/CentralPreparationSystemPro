<header class="sticky top-0 z-30 bg-white/80 dark:bg-[#0B1120]/80 backdrop-blur-md p-4 px-4 sm:px-8 border-b border-slate-200 dark:border-amber-900/30 flex justify-between items-center shadow-sm transition-colors duration-300">
    <div class="flex items-center gap-3 min-w-0">
        <!-- زر فتح القائمة الجانبية (يظهر فقط في الجوال) -->
        <button type="button" onclick="toggleMobileSidebar(true)" class="md:hidden p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 active:scale-95 transition-all focus:outline-none shrink-0" aria-label="فتح القائمة الجانبية">
            <i class="fa-solid fa-bars text-lg"></i>
        </button>

        <!-- خط زينة بجانب العنوان -->
        <div class="w-1.5 h-6 bg-amber-500 rounded-full shadow-[0_0_8px_rgba(245,158,11,0.6)] shrink-0"></div>
        <h2 class="text-lg sm:text-xl font-bold text-slate-800 dark:text-white tracking-wide truncate">
            {% block header_title %}لوحة التحكم{% endblock %}
        </h2>
    </div>
    
    <div class="flex items-center gap-2 sm:gap-4 shrink-0">
        <!-- شريط حالة صغير يعطي طابعاً احترافياً -->
        <div class="hidden sm:flex items-center text-xs font-bold text-slate-500 dark:text-amber-400/80 bg-slate-100 dark:bg-amber-950/30 px-3 py-1.5 rounded-full border border-slate-200 dark:border-amber-900/50">
            <i class="fa-solid fa-bolt text-amber-500 ml-2"></i> النظام متصل
        </div>
        
        <!-- زر الوضع الليلي بتصميم زجاجي وتأثير عند المرور -->
        <button onclick="toggleDarkMode()" class="relative p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700 hover:border-amber-400 dark:hover:border-amber-500 hover:shadow-[0_0_15px_rgba(245,158,11,0.2)] transition-all duration-300 group" aria-label="تبديل الوضع">
            <i id="theme-icon" class="fa-solid fa-moon text-slate-600 dark:text-amber-400 text-lg group-hover:rotate-12 transition-transform"></i>
        </button>
    </div>
</header>
